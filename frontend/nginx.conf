server {
    listen 80;
    # Bind IPv6 too. Without this, `localhost` inside the container resolves to
    # ::1 first and refuses the connection even though the site is serving
    # fine on IPv4 — which is exactly how the container healthcheck failed.
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # The React bundle is compiled with REACT_APP_API_BASE=/api, so every API call
    # is same-origin and lands here. This replaces the previous arrangement where
    # the browser called http://localhost:8001 directly: that baked the host's
    # address into the bundle at compile time, so the app only worked in a browser
    # running on the Docker host and depended on CORS allow_origins=["*"].
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retraining and backtests are long. The retrain endpoint now returns 202
        # immediately, but /model/backtest/run and a cold /data/refresh still hold
        # the connection for minutes; the nginx default of 60s would cut them off.
        proxy_connect_timeout 30s;
        proxy_send_timeout   600s;
        proxy_read_timeout   600s;

        # Progress polling must not be answered from a cache.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
