name: Refresh live data

# Keeps the deployed database current after matches are played.
#
# The backend already runs a 6-hourly refresh loop in-process, but the free Render
# instance sleeps after 15 minutes without traffic — so that loop only advances
# while somebody is using the site. After a late kickoff the results would sit
# stale until the next visitor happened to arrive and wake it.
#
# This workflow wakes the instance and triggers the refresh on a schedule. It is
# free: GitHub Actions has no usage limit on public repositories, whereas Render's
# own cron jobs are a paid feature.
on:
  schedule:
    # Every 3 hours. Premier League matches finish across a wide window and the
    # refresh is cheap, so the interval is set by "how stale is acceptable"
    # rather than by cost.
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  # Refresh is atomic and single-flight server-side, so an overlap is harmless —
  # but queueing two identical runs wastes a cold start on a sleeping instance.
  group: refresh-data
  cancel-in-progress: false

# Least privilege. Nothing here writes to the repository: the deploys are
# driven through Render's and Vercel's own APIs, and deploy-backend.yml pushes
# to Hugging Face with its own token. A workflow that needs more should raise
# it on the one job that needs it, not here.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Needed only for backend/scripts/check_refresh.py. Keeping that logic in a
      # real file rather than inline in YAML means it can be run and tested
      # locally, which is how the stale assertion this workflow used to carry
      # would have been caught.
      - uses: actions/checkout@v4

      - name: Check configuration
        # The presence check reads these from the environment. Interpolating a
        # secret into the script text puts its value in the shell's command
        # line, where a stray quote makes it executable and a trace makes it
        # visible; as a variable it is neither.
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "${ADMIN_API_KEY:-}" || { echo "::error::repository secret ADMIN_API_KEY is not set"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::repository variable API_BASE_URL is not set"; exit 1; }

      - name: Wake the instance
        # A sleeping free instance takes about a minute to come back. Waking it
        # first means the refresh call itself is not competing with a cold start.
        env:
          API: ${{ vars.API_BASE_URL }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$API/health" || true)
            [ "$code" = "200" ] && { echo "awake after $((i*10))s"; exit 0; }
            echo "  attempt $i: HTTP $code"
            sleep 10
          done
          echo "::error::$API/health did not respond within 2 minutes"
          exit 1

      - name: Start the refresh
        env:
          API: ${{ vars.API_BASE_URL }}
          KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          # Refresh is a background job (202 plus a job id), not a synchronous
          # call. It was synchronous once, and this workflow went on grepping the
          # old body for '"status": "refreshed"' long after the server stopped
          # sending one — so every scheduled run failed for eleven days on a
          # refresh that was in fact starting normally. Poll the job instead:
          # that is the only thing that can report how the work actually ended.
          #
          # 200 with started=false is not an error. It means a refresh was already
          # in flight and this request joined it; either way we are handed the job
          # to watch.
          curl -sS --fail-with-body --max-time 120 \
            -X POST "$API/data/refresh" -H "X-Admin-Key: $KEY" -o start.json
          cat start.json
          job=$(python -c "import json;print(json.load(open('start.json'))['job_id'])")
          started=$(python -c "import json;print(json.load(open('start.json')).get('started'))")
          [ "$started" = "True" ] || echo "joined a refresh that was already running"
          echo "job=$job" >> "$GITHUB_ENV"

      - name: Wait for the refresh
        env:
          API: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          # Polling is also what keeps a free instance awake for the duration of
          # the job. Left alone after the POST, the instance can sleep mid-work.
          for i in $(seq 1 40); do
            curl -sS --fail --max-time 60 "$API/data/jobs/$job" -o job.json
            state=$(python -c "import json;print(json.load(open('job.json'))['state'])")
            stage=$(python -c "import json;d=json.load(open('job.json'));print(d.get('stage') or '')")
            echo "  [$i] $state  $stage"
            case "$state" in
              succeeded) exit 0 ;;
              # A failed job must fail the run. Without this the workflow goes
              # green having refreshed nothing, which is exactly the failure mode
              # that made the previous version worth fixing.
              failed) echo "::error::refresh failed"; cat job.json; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::refresh did not finish within 7 minutes"; exit 1

      - name: Check what the refresh did
        env:
          API: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          curl -sS --fail --max-time 60 "$API/data/jobs/$job" -o job.json
          # The summary is written by opening GITHUB_STEP_SUMMARY directly rather
          # than by redirecting stdout: ::error:: annotations are read from a
          # step's stdout, so redirecting it would swallow the one line that makes
          # a bad status visible in the run header.
          python backend/scripts/check_refresh.py

      - name: Confirm the data is actually current
        env:
          API: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          curl -sS --fail --max-time 60 "$API/data/freshness" -o freshness.json
          cat freshness.json
