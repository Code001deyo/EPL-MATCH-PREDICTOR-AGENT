name: Deploy backend to Hugging Face Spaces (optional, requires PRO)

# NOT the primary deploy path. Hugging Face requires a PRO subscription to host
# Docker Spaces — only Static Spaces are free — so `hf repo create` returns
# 402 Payment Required on a free account. The backend deploys to Render instead,
# from render.yaml, which Render redeploys on every push without a workflow.
#
# This is kept, and kept manual, because it works unchanged on a PRO account and
# is the better host when available: 2 vCPU / 16 GB and no idle sleep, against
# Render's free 512 MB and a 15-minute spin-down.
#
# Manual trigger only. Left on `push` it would fail on every commit to main and
# train everyone to ignore a red badge.
on:
  workflow_dispatch:

concurrency:
  # Two deploys racing to force-push the same Space branch would leave whichever
  # finished last, not whichever was newer.
  group: deploy-backend
  cancel-in-progress: false

env:
  HF_SPACE: ${{ vars.HF_SPACE }}          # e.g. yourname/epl-predictor-api

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          test -n "${HF_SPACE}" || { echo "::error::repository variable HF_SPACE is not set (expected owner/space-name)"; exit 1; }
          test -n "${{ secrets.HF_TOKEN }}" || { echo "::error::repository secret HF_TOKEN is not set"; exit 1; }

      - name: Stage the Space repo
        # Same script the manual deploy uses (scripts/deploy-hf.sh), so what CI
        # pushes and what a developer pushes by hand are byte-identical. It also
        # fails loudly if the seed snapshot is missing, which would otherwise
        # deploy a Space that boots and then answers 503 on /predict.
        run: bash scripts/stage-space.sh /tmp/space

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          cd /tmp/space
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install --local || true
          git add -A
          git commit -q -m "Deploy from ${GITHUB_SHA::7}"
          # Force-push: the Space mirrors main, it does not accumulate its own
          # history. The token is only ever in the environment, never in a file
          # and never echoed — hence the redirect on the push.
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main >/dev/null 2>&1

      - name: Wait for the deployed API to answer
        run: |
          set -e
          # HF builds the image after the push, so this polls the real endpoint.
          # A green push is not a green deploy: without this the job would report
          # success while the Space was still failing to build.
          host="https://$(echo "${HF_SPACE}" | tr '/' '-' | tr '[:upper:]' '[:lower:]').hf.space"
          echo "Polling ${host}/health"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${host}/health" || true)
            if [ "$code" = "200" ]; then
              echo "Live after $((i*15))s"
              curl -s "${host}/health"
              exit 0
            fi
            echo "  attempt ${i}: HTTP ${code}"
            sleep 15
          done
          echo "::error::${host}/health did not return 200 within 15 minutes — check the Space build logs"
          exit 1
