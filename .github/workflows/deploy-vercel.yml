name: Verify the frontend deployed

# Vercel's own git integration builds and deploys this project. This workflow
# checks that it actually did.
#
# It used to deploy from CI as well. That path is gone, and the reason is worth
# recording: the Vercel CLI would not authenticate with a token the REST API
# accepted for the same project - `whoami` answered "User not found" and every
# `pull` and `build` died on "Could not retrieve Project Settings". Reconnecting
# the git integration removed the credential from the loop entirely.
#
# What is kept is the half that earned its place. On 2026-08-29 the git
# integration silently stopped firing: production sat ten commits behind for five
# days, every dashboard still described itself as connected, and nothing in
# GitHub said otherwise. Deploying from CI was only ever the workaround. Noticing
# was the point.
#
# So this fails a check on the commit when the site does not catch up, which is
# the signal that was missing - and it needs no token.
#
# One repository variable:
#
#   SITE_BASE_URL   https://novapl.vercel.app

on:
  push:
    branches: [main]
    paths:
      # frontend/** only, deliberately. Vercel's root directory for this project
      # is frontend/, so it skips a build when nothing there changed. Including
      # this workflow's own path made the check fail for a deploy that correctly
      # never happened, which is the kind of false alarm that teaches people to
      # ignore a red check.
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: verify-vercel
  cancel-in-progress: false

env:
  SITE: ${{ vars.SITE_BASE_URL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        run: |
          test -n "$SITE" || { echo "::error::repository variable SITE_BASE_URL is not set"; exit 1; }

      - name: Wait for the site to serve this commit
        # A 200 from any path proves nothing: vercel.json rewrites every non-/api
        # path to index.html, so an unknown route returns the app shell with a 200
        # whether the page exists or not. That is exactly how a missing page went
        # unnoticed. The build-commit meta tag is compared instead - CRA inlines
        # it at build time, so it can only be right if this commit is the one that
        # was built.
        run: |
          set -euo pipefail
          # Vercel builds this project in about 30 seconds, but a queue is normal,
          # so allow ten minutes before calling it stuck.
          live=""
          for i in $(seq 1 40); do
            live=$(curl -sS --max-time 30 "${SITE}/" \
                   | grep -oE '<meta name="build-commit" content="[^"]*"' \
                   | sed -E 's/.*content="([^"]*)".*/\1/' || true)
            echo "[$i] serving: ${live:-<none>}"
            if [ "$live" = "${GITHUB_SHA}" ]; then
              echo "Verified: ${SITE} is serving ${GITHUB_SHA:0:8}"
              exit 0
            fi
            sleep 15
          done

          echo "::error::${SITE} is still not serving ${GITHUB_SHA:0:8} after ten minutes"
          echo "Last seen: ${live:-<no build-commit tag>}"
          echo
          echo "The git integration has probably stopped firing again. Check"
          echo "Project > Settings > Git in the Vercel dashboard. To ship in the"
          echo "meantime, from a logged-in CLI:"
          echo "  cd frontend"
          echo "  vercel deploy --prod --build-env REACT_APP_COMMIT=\$(git rev-parse HEAD)"
          exit 1
