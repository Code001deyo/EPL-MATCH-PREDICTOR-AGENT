name: CI

# Runs on every push and PR. The deploy workflow waits on this, so a red test
# suite stops a deploy rather than being discovered after it.
on:
  push:
    branches: [main]
  pull_request:
  # Called by deploy-backend.yml so a deploy runs the same suite rather than a
  # second, drifting copy of it.
  workflow_call:

# Least privilege. Nothing here writes to the repository: the deploys are
# driven through Render's and Vercel's own APIs, and deploy-backend.yml pushes
# to Hugging Face with its own token. A workflow that needs more should raise
# it on the one job that needs it, not here.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest

      - name: Verify the baked models match their checksums
        working-directory: backend
        # A .pkl is executable code: joblib.load is pickle.load. This makes a
        # model file that changed without its recorded hash a red check on the
        # pull request, rather than something discovered on the deploy host.
        run: python scripts/verify_seed_models.py

      - name: Run tests
        working-directory: backend
        # DATA_DIR points at a scratch path: the suite must never touch the
        # committed seed database.
        env:
          DATA_DIR: ${{ runner.temp }}/eplci
        run: pytest tests/ -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: the build must use the exact locked tree. An unlocked
      # install once shipped an image whose dependency tree had never been tested.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # A successful build says the code compiles. It says nothing about a
      # component that compiles and then throws on first render, which in a
      # client-rendered app is a blank white page rather than a visible error.
      - name: Run tests
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: frontend
        # CRA warnings are not failures here, but they are visible in the log.
        run: npm run build
  qa:
    name: Frontend QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      # Served without a backend on purpose, so every page has to render its
      # honest empty state and stay laid out - the state a freshly deployed
      # instance actually serves before ingestion finishes.
      #
      # Note what `serve -s` really does with /api: it does NOT answer 404. The
      # SPA fallback catches those paths too and returns index.html with a 200,
      # which is precisely what a misconfigured rewrite does in production. This
      # comment used to claim 404s, and that wrong premise hid a real bug for as
      # long as it stood - three pages read a field off a body that was HTML,
      # stored `undefined` where they had arrays, and white-screened on the first
      # `.map`. See frontend/src/api.js. Keep the fallback: it is the harder and
      # more realistic test of the two.
      - name: Serve the production build
        working-directory: frontend
        run: |
          npx --yes serve -s build -l 3000 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          echo "::error::the static server did not come up"; exit 1

      # Headless Chrome, because a real Chrome window on a developer machine will
      # not go below ~500px and cannot reach 1920 on a 1366 display. 3 pages at
      # 6 widths: horizontal overflow, over-wide elements, console errors,
      # tap-target size, and whether the page rendered at all.
      - name: Responsive and accessibility checks
        working-directory: frontend
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run qa:responsive -- http://localhost:3000

      # The evidence, kept for the eye check no assertion replaces.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: qa-screenshots
          path: frontend/screenshots/
          retention-days: 7
          if-no-files-found: warn


  seed-artefacts:
    name: Seed snapshot present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The deployed backend has no persistent disk and relies on these being in
      # the image. A .gitignore change that silently dropped them would otherwise
      # only be noticed by a user hitting a 503 in production.
      - name: Assert the baked snapshot is tracked
        run: |
          test -f backend/seed/epl.db || { echo "::error::backend/seed/epl.db is missing"; exit 1; }
          test -f backend/seed/models/home_goals_model.pkl || { echo "::error::baked models are missing"; exit 1; }
          echo "seed snapshot: $(du -sh backend/seed | cut -f1)"
